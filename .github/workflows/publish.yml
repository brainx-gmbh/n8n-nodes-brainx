name: Publish

on:
  push:
    tags:
      - '*.*.*'   # z.B. 1.0.0 — triggert auf jeden Version-Tag

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Pflicht für OIDC Provenance
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: npm run release
        env:
          GITHUB_ACTIONS: 'true'
          # NPM_TOKEN nur wenn kein OIDC Trusted Publisher (siehe unten)
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }}